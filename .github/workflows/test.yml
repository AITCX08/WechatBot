name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    # Project targets Windows (uiautomation/pywin32/pyperclip via Windows clipboard).
    # Use windows-latest runners.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          # Skip ipykernel / jupyter / pandas / google-generativeai etc. —
          # heavy + not needed by the test suite.
          pip install fastapi uvicorn httpx pytest pytest-mock pyyaml requests pillow
          pip install uiautomation pyperclip pywin32
        shell: bash

      - name: Build SQLite fixture
        run: python tests/fixtures/sample_contact.py
        shell: bash

      - name: Run pytest
        run: pytest tests/ -v --tb=short
        shell: bash
