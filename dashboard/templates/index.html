<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WeChatRobot Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  .mono { font-family: "JetBrains Mono", Menlo, Consolas, "Courier New", monospace; font-size: 12px; }
  .log-DEBUG  { color: #6b7280; }
  .log-INFO   { color: #1f2937; }
  .log-WARNING{ color: #b45309; }
  .log-ERROR  { color: #b91c1c; font-weight: 600; }
  .log-CRITICAL { color: #7f1d1d; background: #fef2f2; font-weight: 700; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:2px 10px; border-radius:9999px; font-size:11px; font-weight:600; }
  .dot { width:6px; height:6px; border-radius:9999px; display:inline-block; }
  .tab-active { border-color:#1f2937; color:#1f2937; }
  .tab-inactive { border-color:transparent; color:#6b7280; }
  .status-stopped { background:#f4f4f5; color:#71717a; border:1px solid #e4e4e7; }
  .status-starting { background:#fef3c7; color:#92400e; border:1px solid #fde68a; }
  .status-running  { background:#d1fae5; color:#065f46; border:1px solid #6ee7b7; }
  .status-stopping { background:#fef3c7; color:#92400e; border:1px solid #fde68a; }
  .status-error    { background:#fee2e2; color:#991b1b; border:1px solid #fecaca; }
  .btn { padding:4px 10px; border-radius:6px; font-size:11px; font-weight:600; transition:all .15s; }
  .btn-primary { background:#1f2937; color:white; }
  .btn-primary:hover { background:#0f172a; }
  .btn-success { background:#059669; color:white; }
  .btn-success:hover { background:#047857; }
  .btn-warning { background:#d97706; color:white; }
  .btn-warning:hover { background:#b45309; }
  .btn-danger { background:#dc2626; color:white; }
  .btn-danger:hover { background:#b91c1c; }
  .btn-ghost { border:1px solid #d4d4d8; color:#3f3f46; background:white; }
  .btn-ghost:hover { background:#f4f4f5; }
  .btn:disabled { opacity:0.4; cursor:not-allowed; }
</style>
</head>
<body class="bg-zinc-50 text-zinc-900">
<div x-data="app()" x-init="init()" class="min-h-screen">

  <!-- Top bar -->
  <header class="bg-white border-b border-zinc-200 sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-zinc-900 text-white grid place-items-center font-bold">W</div>
        <div>
          <div class="text-sm font-semibold">WeChatRobot Dashboard</div>
          <div class="text-xs text-zinc-500">Weixin 4.x · sidecar + UIA · 多账号</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <template x-if="status.paused">
          <button @click="globalResume()" class="btn btn-success">▶ 全局恢复</button>
        </template>
        <template x-if="!status.paused">
          <button @click="globalPause()" class="btn btn-warning">⏸ 全局暂停</button>
        </template>
        <span class="pill" :class="status.paused ? 'bg-amber-50 text-amber-700 border border-amber-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'">
          <span class="dot" :class="status.paused ? 'bg-amber-500' : 'bg-emerald-500'"></span>
          <span x-text="status.paused ? '全局已暂停' : '正常'"></span>
        </span>
      </div>
    </div>
  </header>

  <!-- Toast notifications (fixed bottom-right) -->
  <div class="fixed bottom-4 right-4 z-50 space-y-2 max-w-md">
    <template x-for="t in toasts" :key="t.id">
      <div class="rounded-lg shadow-lg px-4 py-3 text-sm border"
           :class="{
             'bg-red-50 border-red-200 text-red-800':   t.kind === 'error',
             'bg-emerald-50 border-emerald-200 text-emerald-800': t.kind === 'success',
             'bg-zinc-50 border-zinc-200 text-zinc-800': t.kind === 'info',
           }">
        <span class="font-semibold mr-2" x-text="t.kind === 'error' ? '❗' : t.kind === 'success' ? '✅' : 'ℹ️'"></span>
        <span x-text="t.message"></span>
      </div>
    </template>
  </div>

  <main class="max-w-7xl mx-auto px-6 py-6">

    <!-- Standalone-mode banner -->
    <template x-if="status.factory_registered === false">
      <div class="mb-4 rounded-lg border border-amber-300 bg-amber-50 px-4 py-3 text-sm text-amber-900">
        <span class="font-semibold">⚠ Dashboard 处于 standalone 预览模式</span>
        ——bot factory 未注册，"启动" 按钮已禁用。要真正启动 bot，请运行
        <code class="bg-amber-100 px-1.5 py-0.5 rounded mx-1">python main.py -c 7</code>
        （或带 <code class="bg-amber-100 px-1.5 py-0.5 rounded">--auto-start</code> 自动拉起所有账号）。
      </div>
    </template>

    <!-- Overall metrics -->
    <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6">
      <div class="bg-white rounded-lg border border-zinc-200 p-3">
        <div class="text-xs text-zinc-500">运行时长</div>
        <div class="text-lg font-semibold mt-1" x-text="formatUptime(status.uptime_sec || 0)"></div>
      </div>
      <div class="bg-white rounded-lg border border-zinc-200 p-3">
        <div class="text-xs text-zinc-500">在线账号</div>
        <div class="text-lg font-semibold mt-1" x-text="onlineCount() + '/' + (status.accounts?.length || 0)"></div>
      </div>
      <div class="bg-white rounded-lg border border-zinc-200 p-3">
        <div class="text-xs text-zinc-500">消息队列(汇总)</div>
        <div class="text-lg font-semibold mt-1" x-text="status.queue_depth || 0"></div>
      </div>
      <div class="bg-white rounded-lg border border-zinc-200 p-3">
        <div class="text-xs text-zinc-500">待确认订单</div>
        <div class="text-lg font-semibold mt-1" x-text="status.pending_orders || 0"></div>
      </div>
      <div class="bg-white rounded-lg border border-zinc-200 p-3">
        <div class="text-xs text-zinc-500">今日订单(汇总)</div>
        <div class="text-lg font-semibold mt-1" x-text="status.daily_orders || 0"></div>
      </div>
    </div>

    <!-- Accounts grid -->
    <div class="bg-white rounded-lg border border-zinc-200 mb-6">
      <div class="px-4 py-3 border-b border-zinc-200 flex items-center justify-between">
        <h2 class="text-sm font-semibold">账号列表</h2>
        <span class="text-xs text-zinc-500" x-text="'共 ' + (status.accounts?.length || 0) + ' 个'"></span>
      </div>
      <div class="p-4">
        <template x-if="!status.accounts?.length">
          <div class="text-sm text-zinc-500 italic">
            尚未配置账号。请在 <span class="mono">config.yaml</span> 的
            <span class="mono">weixin.instances</span> 中添加，或检查 main.py 是否注册了账号。
          </div>
        </template>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
          <template x-for="acc in (status.accounts || [])" :key="acc.name">
            <div class="border border-zinc-200 rounded-lg p-3">
              <div class="flex items-center justify-between mb-2">
                <div>
                  <div class="text-sm font-semibold" x-text="acc.label"></div>
                  <div class="text-xs text-zinc-500 mono" x-text="acc.name"></div>
                </div>
                <span class="pill" :class="'status-' + acc.status" x-text="statusLabel(acc.status)"></span>
              </div>

              <div class="grid grid-cols-2 gap-2 text-xs text-zinc-600 mb-3">
                <div class="flex items-center gap-1.5">
                  <span class="dot" :class="acc.weixin_attached ? 'bg-emerald-500' : 'bg-zinc-300'"></span>
                  <span>Weixin <span x-text="acc.weixin_attached ? '已附加' : '未附加'"></span></span>
                </div>
                <div class="flex items-center gap-1.5">
                  <span class="dot" :class="acc.sidecar_alive ? 'bg-emerald-500' : 'bg-zinc-300'"></span>
                  <span>Sidecar <span x-text="acc.sidecar_alive ? '存活' : '离线'"></span></span>
                </div>
                <div>队列: <span class="font-semibold" x-text="acc.queue_depth || 0"></span></div>
                <div>待确认: <span class="font-semibold" x-text="acc.pending_orders || 0"></span></div>
                <div>今日: <span class="font-semibold" x-text="acc.daily_orders || 0"></span></div>
                <div>运行: <span x-text="formatUptime(acc.uptime_sec || 0)"></span></div>
              </div>

              <template x-if="acc.last_error">
                <div class="text-xs text-red-600 mb-2 break-all" x-text="'❗ ' + acc.last_error"></div>
              </template>

              <div class="flex flex-wrap gap-1.5">
                <template x-if="acc.status === 'stopped' || acc.status === 'error'">
                  <button @click="accStart(acc.name)" :disabled="!status.factory_registered"
                          :title="status.factory_registered ? '' : 'Standalone 模式不能启动 bot；请用 python main.py -c 7'"
                          class="btn btn-success">▶ 启动</button>
                </template>
                <template x-if="acc.status === 'running' && !acc.paused">
                  <button @click="accPause(acc.name)" class="btn btn-warning">⏸ 暂停</button>
                </template>
                <template x-if="acc.status === 'running' && acc.paused">
                  <button @click="accResume(acc.name)" class="btn btn-success">▶ 恢复</button>
                </template>
                <template x-if="acc.status === 'running' || acc.status === 'starting'">
                  <button @click="accStop(acc.name)" class="btn btn-danger">■ 停止</button>
                </template>
                <button @click="accountFilter = acc.name; tab = 'logs'" class="btn btn-ghost">📋 查看</button>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="bg-white rounded-lg border border-zinc-200">
      <div class="border-b border-zinc-200 flex items-center">
        <template x-for="t in ['logs','messages','orders','contacts']" :key="t">
          <button @click="tab = t"
            class="px-4 py-2.5 text-sm font-medium border-b-2 -mb-px"
            :class="tab === t ? 'tab-active' : 'tab-inactive hover:text-zinc-700'">
            <span x-text="tabLabel(t)"></span>
          </button>
        </template>
        <div class="flex-1"></div>
        <div class="px-3 py-2 flex items-center gap-2">
          <label class="text-xs text-zinc-500">账号过滤:</label>
          <select x-model="accountFilter" class="border border-zinc-300 rounded px-2 py-1 text-xs">
            <option value="">全部</option>
            <template x-for="a in (status.accounts || [])" :key="a.name">
              <option :value="a.name" x-text="a.label"></option>
            </template>
          </select>
          <span class="text-xs text-zinc-500 ml-2" x-text="lastUpdate"></span>
        </div>
      </div>

      <!-- Logs tab -->
      <div x-show="tab === 'logs'" class="p-4">
        <div class="flex gap-2 mb-3">
          <select x-model="logLevel" class="border border-zinc-300 rounded px-2 py-1.5 text-sm">
            <option value="">全部级别</option>
            <option value="DEBUG">DEBUG</option>
            <option value="INFO">INFO</option>
            <option value="WARNING">WARNING</option>
            <option value="ERROR">ERROR</option>
            <option value="CRITICAL">CRITICAL</option>
          </select>
          <input x-model.debounce.300ms="logQuery" type="text" placeholder="关键词搜索..."
            class="flex-1 border border-zinc-300 rounded px-3 py-1.5 text-sm" />
          <button @click="autoScroll = !autoScroll"
            class="px-3 py-1.5 rounded border text-xs"
            :class="autoScroll ? 'bg-zinc-900 text-white border-zinc-900' : 'bg-white text-zinc-700 border-zinc-300'">
            自动滚动
          </button>
          <button @click="clearLogs()" class="px-3 py-1.5 rounded border border-zinc-300 text-xs">清空显示</button>
        </div>
        <div x-ref="logBox" class="mono bg-zinc-50 border border-zinc-200 rounded h-[420px] overflow-auto p-3 leading-relaxed">
          <template x-for="row in filteredLogs()" :key="row.seq">
            <div class="flex gap-3" :class="'log-' + row.level">
              <span class="text-zinc-400 shrink-0" x-text="formatTs(row.ts)"></span>
              <span class="shrink-0 w-16 uppercase" x-text="row.level"></span>
              <span class="shrink-0 text-zinc-500" x-text="row.logger"></span>
              <span class="break-all" x-text="row.message"></span>
            </div>
          </template>
          <div x-show="filteredLogs().length === 0" class="text-zinc-400 italic">无日志</div>
        </div>
      </div>

      <!-- Messages tab -->
      <div x-show="tab === 'messages'" class="p-4">
        <div class="flex gap-2 mb-3">
          <input x-model.debounce.300ms="msgQuery" type="text" placeholder="搜索发送者 / 内容..."
            class="flex-1 border border-zinc-300 rounded px-3 py-1.5 text-sm" />
        </div>
        <div class="h-[420px] overflow-auto border border-zinc-200 rounded">
          <table class="w-full text-sm">
            <thead class="bg-zinc-50 text-xs text-zinc-500 uppercase sticky top-0">
              <tr>
                <th class="text-left px-3 py-2 w-24">账号</th>
                <th class="text-left px-3 py-2 w-32">时间</th>
                <th class="text-left px-3 py-2 w-12">类型</th>
                <th class="text-left px-3 py-2 w-40">发送者</th>
                <th class="text-left px-3 py-2 w-40">群</th>
                <th class="text-left px-3 py-2">内容</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="row in filteredMessages()" :key="row.seq">
                <tr class="border-t border-zinc-100 hover:bg-zinc-50">
                  <td class="px-3 py-2 text-xs text-zinc-500" x-text="row.account || '-'"></td>
                  <td class="px-3 py-2 text-xs text-zinc-500" x-text="formatTs(row.ts)"></td>
                  <td class="px-3 py-2 text-xs" x-text="row.type"></td>
                  <td class="px-3 py-2 mono text-xs" x-text="row.sender"></td>
                  <td class="px-3 py-2 mono text-xs text-zinc-500" x-text="row.roomid || '-'"></td>
                  <td class="px-3 py-2 break-all" x-text="row.content"></td>
                </tr>
              </template>
              <tr x-show="filteredMessages().length === 0">
                <td colspan="6" class="px-3 py-6 text-center text-zinc-400 italic">无消息</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Orders tab -->
      <div x-show="tab === 'orders'" class="p-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <h3 class="text-sm font-semibold mb-2 text-zinc-700">待确认订单</h3>
            <div class="border border-zinc-200 rounded h-[400px] overflow-auto">
              <template x-for="o in pendingOrders" :key="o.account + '|' + o.wxid">
                <div class="border-b border-zinc-100 p-3 text-sm">
                  <div class="flex items-center justify-between mb-1">
                    <span class="text-xs text-zinc-500"><span x-text="o.account"></span> · <span class="mono" x-text="o.wxid"></span></span>
                    <span class="text-xs text-amber-600" x-text="'第 ' + (o.extract_rounds || 0) + ' 轮'"></span>
                  </div>
                  <div class="text-zinc-700">
                    <div x-text="'学校: ' + (o.school || '—')"></div>
                    <div x-text="'课程: ' + (o.kcname || '—') + ' (' + (o.kcid || '—') + ')'"></div>
                    <div x-text="'账号: ' + (o.user || '—')"></div>
                    <div x-text="'平台: ' + (o.platform || '—')"></div>
                  </div>
                </div>
              </template>
              <div x-show="!pendingOrders.length" class="text-zinc-400 italic p-3">无待确认订单</div>
            </div>
          </div>
          <div>
            <h3 class="text-sm font-semibold mb-2 text-zinc-700">最近事件</h3>
            <div class="border border-zinc-200 rounded h-[400px] overflow-auto">
              <table class="w-full text-sm">
                <tbody>
                  <template x-for="a in filteredAudit().slice().reverse()" :key="a.seq">
                    <tr class="border-b border-zinc-100">
                      <td class="px-3 py-2 text-xs text-zinc-500 w-28" x-text="formatTs(a.ts)"></td>
                      <td class="px-3 py-2">
                        <span class="pill" :class="eventClass(a.event)" x-text="a.event"></span>
                      </td>
                      <td class="px-3 py-2 mono text-xs text-zinc-500" x-text="a.wxid || (a.draft && a.draft.requester_wxid) || '-'"></td>
                    </tr>
                  </template>
                  <tr x-show="!filteredAudit().length">
                    <td colspan="3" class="px-3 py-6 text-center text-zinc-400 italic">无事件</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- Contacts tab -->
      <div x-show="tab === 'contacts'" class="p-4">
        <div class="flex gap-2 mb-3">
          <input x-model.debounce.300ms="contactQuery" type="text" placeholder="搜索 wxid 或备注..."
            class="flex-1 border border-zinc-300 rounded px-3 py-1.5 text-sm" />
          <button @click="loadContacts()" class="px-3 py-1.5 rounded border border-zinc-300 text-xs">刷新</button>
          <span class="self-center text-xs text-zinc-500" x-text="'共 ' + contactTotal + ' 条'"></span>
        </div>
        <div class="h-[400px] overflow-auto border border-zinc-200 rounded">
          <table class="w-full text-sm">
            <thead class="bg-zinc-50 text-xs text-zinc-500 uppercase sticky top-0">
              <tr>
                <th class="text-left px-3 py-2 w-64">wxid</th>
                <th class="text-left px-3 py-2">备注/昵称</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="c in contacts" :key="c.wxid">
                <tr class="border-t border-zinc-100 hover:bg-zinc-50">
                  <td class="px-3 py-2 mono text-xs" x-text="c.wxid"></td>
                  <td class="px-3 py-2" x-text="c.name"></td>
                </tr>
              </template>
              <tr x-show="!contacts.length">
                <td colspan="2" class="px-3 py-6 text-center text-zinc-400 italic">无联系人</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>

    <div class="text-xs text-zinc-400 text-center mt-6">
      127.0.0.1:9090 · SSE 实时推送 · 仅本机访问
    </div>
  </main>
</div>

<script>
function app() {
  return {
    tab: 'logs',
    status: { accounts: [] },
    logs: [],
    logLevel: '',
    logQuery: '',
    autoScroll: true,
    messages: [],
    msgQuery: '',
    auditItems: [],
    pendingOrders: [],
    contacts: [],
    contactQuery: '',
    contactTotal: 0,
    accountFilter: '',
    lastUpdate: '',
    es: null,
    toasts: [],
    _toastSeq: 0,

    init() {
      this.bootstrap();
      this.openStream();
      this.timer = setInterval(() => this.refreshPending(), 5000);
      this.$watch('contactQuery', () => this.loadContacts());
      this.$watch('accountFilter', () => this.loadContacts());
      this.loadContacts();
    },
    bootstrap() {
      fetch('/api/logs?n=200').then(r => r.json()).then(d => { this.logs = d.items; this.scrollLogs(); });
      fetch('/api/messages?n=100').then(r => r.json()).then(d => { this.messages = d.items; });
      fetch('/api/audit?n=100').then(r => r.json()).then(d => { this.auditItems = d.items; });
      this.refreshPending();
    },
    openStream() {
      this.es = new EventSource('/api/events');
      this.es.addEventListener('status', e => {
        this.status = JSON.parse(e.data);
        this.lastUpdate = new Date().toLocaleTimeString();
      });
      this.es.addEventListener('logs', e => {
        const newLogs = JSON.parse(e.data);
        this.logs = [...this.logs, ...newLogs].slice(-1000);
        this.scrollLogs();
      });
      this.es.addEventListener('messages', e => {
        const newMsgs = JSON.parse(e.data);
        this.messages = [...this.messages, ...newMsgs].slice(-500);
      });
      this.es.addEventListener('audit', e => {
        const newAudit = JSON.parse(e.data);
        this.auditItems = [...this.auditItems, ...newAudit].slice(-500);
      });
    },
    scrollLogs() {
      if (!this.autoScroll) return;
      this.$nextTick(() => {
        const el = this.$refs.logBox;
        if (el) el.scrollTop = el.scrollHeight;
      });
    },

    // ---- toast ----
    showToast(kind, message, timeoutMs = 4000) {
      const id = ++this._toastSeq;
      this.toasts.push({ id, kind, message });
      setTimeout(() => {
        this.toasts = this.toasts.filter(t => t.id !== id);
      }, timeoutMs);
    },

    // ---- generic API helper ----
    // POST helper that reads response, toasts on error, refreshes status on success.
    async apiCall(method, url, opts = {}) {
      const { body = null, successMsg = null, errorPrefix = '操作失败' } = opts;
      const init = { method, headers: { 'Content-Type': 'application/json' } };
      if (body !== null) init.body = JSON.stringify(body);
      try {
        const resp = await fetch(url, init);
        let data = null;
        try { data = await resp.json(); } catch (_) { /* non-json response */ }
        if (!resp.ok) {
          const detail = (data && (data.detail || data.msg)) || `HTTP ${resp.status}`;
          this.showToast('error', `${errorPrefix}: ${detail}`);
          return { ok: false, detail };
        }
        if (successMsg) this.showToast('success', successMsg);
        // refresh status immediately (don't wait 1s for next SSE tick)
        this.refreshStatus();
        return { ok: true, data };
      } catch (e) {
        this.showToast('error', `${errorPrefix}: ${e.message || e}`);
        return { ok: false, detail: e.message || String(e) };
      }
    },

    // ---- global controls ----
    globalPause() {
      this.apiCall('POST', '/api/pause', { body: { reason: 'manual' }, successMsg: '全局已暂停' });
    },
    globalResume() {
      this.apiCall('POST', '/api/resume', { successMsg: '全局已恢复' });
    },

    // ---- per-account controls ----
    accStart(name) {
      this.apiCall('POST', `/api/accounts/${name}/start`,
        { successMsg: `[${name}] 启动中... 看日志页确认登录进度`, errorPrefix: `[${name}] 启动失败` });
    },
    accStop(name) {
      this.apiCall('POST', `/api/accounts/${name}/stop`,
        { successMsg: `[${name}] 已停止`, errorPrefix: `[${name}] 停止失败` });
    },
    accPause(name) {
      this.apiCall('POST', `/api/accounts/${name}/pause`,
        { body: { reason: 'manual' }, successMsg: `[${name}] 已暂停`, errorPrefix: `[${name}] 暂停失败` });
    },
    accResume(name) {
      this.apiCall('POST', `/api/accounts/${name}/resume`,
        { successMsg: `[${name}] 已恢复`, errorPrefix: `[${name}] 恢复失败` });
    },

    refreshPending() {
      const q = this.accountFilter ? `?account=${encodeURIComponent(this.accountFilter)}` : '';
      fetch('/api/orders/pending' + q).then(r => r.json()).then(d => this.pendingOrders = d.items || []);
    },
    loadContacts() {
      const params = new URLSearchParams();
      if (this.contactQuery) params.set('q', this.contactQuery);
      if (this.accountFilter) params.set('account', this.accountFilter);
      const qs = params.toString();
      fetch('/api/contacts' + (qs ? '?' + qs : '')).then(r => r.json()).then(d => {
        this.contacts = d.items || [];
        this.contactTotal = d.total || 0;
      });
    },

    clearLogs() { this.logs = []; },
    onlineCount() {
      return (this.status.accounts || []).filter(a => a.status === 'running').length;
    },
    statusLabel(s) {
      return { stopped: '已停止', starting: '启动中', running: '运行中', stopping: '停止中', error: '错误' }[s] || s;
    },

    filteredLogs() {
      let out = this.logs;
      if (this.logLevel) out = out.filter(r => r.level === this.logLevel);
      if (this.logQuery) {
        const q = this.logQuery.toLowerCase();
        out = out.filter(r => (r.message || '').toLowerCase().includes(q));
      }
      if (this.accountFilter) {
        out = out.filter(r => !r.account || r.account === this.accountFilter);
      }
      return out;
    },
    filteredMessages() {
      let out = this.messages;
      if (this.accountFilter) out = out.filter(r => !r.account || r.account === this.accountFilter);
      if (this.msgQuery) {
        const q = this.msgQuery.toLowerCase();
        out = out.filter(r =>
          (r.content || '').toLowerCase().includes(q) ||
          (r.sender || '').toLowerCase().includes(q)
        );
      }
      return out.slice().reverse();
    },
    filteredAudit() {
      if (!this.accountFilter) return this.auditItems;
      return this.auditItems.filter(a => !a.account || a.account === this.accountFilter);
    },

    tabLabel(t) {
      return { logs: '日志', messages: '消息', orders: '订单', contacts: '联系人' }[t];
    },
    formatTs(ts) {
      if (!ts) return '';
      const d = new Date(ts * 1000);
      return d.toLocaleTimeString('zh-CN', { hour12: false }) + '.' + String(d.getMilliseconds()).padStart(3, '0');
    },
    formatUptime(s) {
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      if (h > 0) return `${h}h ${m}m`;
      if (m > 0) return `${m}m ${sec}s`;
      return `${sec}s`;
    },
    eventClass(ev) {
      if (!ev) return 'bg-zinc-100 text-zinc-700 border border-zinc-200';
      if (ev.includes('error') || ev.includes('abort')) return 'bg-red-50 text-red-700 border border-red-200';
      if (ev.includes('cancel')) return 'bg-amber-50 text-amber-700 border border-amber-200';
      if (ev.includes('dry_run')) return 'bg-sky-50 text-sky-700 border border-sky-200';
      if (ev.startsWith('place')) return 'bg-emerald-50 text-emerald-700 border border-emerald-200';
      return 'bg-zinc-100 text-zinc-700 border border-zinc-200';
    },
  };
}
</script>
</body>
</html>
